<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador de Horarios — Ahora en SIGA</title>
    <meta http-equiv="refresh" content="3;url=https://harrypc2023.github.io/portal-siga/horarios/">
    <link rel="manifest" href="manifest.json">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            min-height: 100vh;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background: linear-gradient(135deg, #EAF2FF 0%, #E4CAF6 100%);
        }

        .card {
            background: #FFFDF9;
            border-radius: 20px;
            max-width: 420px;
            width: 100%;
            padding: 40px 32px;
            text-align: center;
            box-shadow: 0 10px 40px rgba(60, 124, 248, 0.15);
        }

        .icono {
            width: 64px;
            height: 64px;
            margin: 0 auto 20px;
            border-radius: 16px;
            background: #3C7CF8;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
        }

        h1 {
            font-size: 20px;
            font-weight: 700;
            color: #26215C;
            margin: 0 0 8px;
        }

        p {
            font-size: 14px;
            color: #5F5E5A;
            margin: 0 0 24px;
            line-height: 1.55;
        }

        .progreso {
            height: 4px;
            width: 100%;
            background: #E4CAF6;
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 16px;
        }

        .progreso-barra {
            height: 100%;
            width: 0%;
            background: #3C7CF8;
            border-radius: 4px;
            animation: avanzar 1.8s linear forwards;
        }

        @keyframes avanzar {
            to {
                width: 100%;
            }
        }

        .estado {
            font-size: 12px;
            color: #888780;
            margin-bottom: 20px;
        }

        a.btn {
            display: inline-block;
            text-decoration: none;
            background: #3C7CF8;
            color: #FFFDF9;
            font-weight: 600;
            font-size: 14px;
            padding: 12px 26px;
            border-radius: 10px;
        }

        a.btn:hover {
            background: #2f68d6;
        }

        noscript p {
            margin-top: 12px;
        }
    </style>
</head>

<body>
    <div class="card">
        <div class="icono">🗓️</div>
        <h1>Generador de Horarios ahora vive en SIGA</h1>
        <p>Esta app ya no funciona por separado. Te estamos llevando a la versión completa dentro de SIGA, donde también
            tienes Intranotas, Asesorías, Materiales y Opiniones de Profesores.</p>
        <div class="progreso">
            <div class="progreso-barra"></div>
        </div>
        <div class="estado" id="estado">Redirigiendo…</div>
        <a class="btn" id="btnIr" href="https://harrypc2023.github.io/portal-siga/horarios/">Ir a SIGA ahora</a>
    </div>

    <noscript>
        <p style="text-align:center; font-family: sans-serif; margin-top: 16px;">
            Si no fuiste redirigido automáticamente, entra aquí:
            <a href="https://harrypc2023.github.io/portal-siga/horarios/">harrypc2023.github.io/portal-siga/horarios</a>
        </p>
    </noscript>

    <script>
        var DESTINO = "https://harrypc2023.github.io/portal-siga/horarios/";

        setTimeout(function () {
            window.location.href = DESTINO;
        }, 1800);

        // La app queda retirada: se desregistra cualquier Service Worker
        // y se limpia el caché de versiones anteriores instaladas como PWA.
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function (regs) {
                regs.forEach(function (r) { r.unregister(); });
            });
        }
        if (window.caches) {
            caches.keys().then(function (keys) {
                keys.forEach(function (k) { caches.delete(k); });
            });
        }
    </script>
</body>

</html>
